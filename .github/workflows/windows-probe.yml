# Temporary: finds out why the app's WebView2 gives no remote debugging port on the Windows runner.
name: Windows probe

on:
  push:
    branches: [rust-rewrite]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build the app
        shell: bash
        run: cargo build --locked --release -p portfolio-lab
      - name: Probe the app
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'probe'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $app = (Resolve-Path target\release\portfolio-lab.exe).Path
          $policy = 'SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'

          function Show-Browser {
            Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'" | Where-Object { $_.CommandLine -notmatch '--type=' } |
              ForEach-Object { "Browser $($_.ProcessId): $($_.CommandLine)" }
          }
          function Test-Port([int] $port) {
            try {
              $pages = Invoke-RestMethod "http://127.0.0.1:$port/json/list" -TimeoutSec 5
              "Port ${port}: " + (($pages | ForEach-Object { "$($_.type) $($_.url) | $($_.title)" }) -join '; ')
            } catch { "Port ${port}: closed" }
          }
          function Stop-All {
            Get-Process portfolio-lab, msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
          }

          "`n=== environment variable with a harmless switch ==="
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--force-device-scale-factor=1.25'
          Start-Process -FilePath $app
          Remove-Item env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
          Start-Sleep -Seconds 20
          Show-Browser
          Stop-All

          foreach ($case in @(
              @{ Root = 'HKLM'; Name = 'portfolio-lab.exe'; Port = 9333 },
              @{ Root = 'HKLM'; Name = '*'; Port = 9334 },
              @{ Root = 'HKCU'; Name = 'portfolio-lab.exe'; Port = 9336 })) {
            "`n=== policy $($case.Root) '$($case.Name)' ==="
            reg add "$($case.Root)\$policy" /v $case.Name /t REG_SZ /d "--remote-debugging-port=$($case.Port)" /f
            reg query "$($case.Root)\$policy"
            Start-Process -FilePath $app
            Start-Sleep -Seconds 20
            Show-Browser
            Test-Port $case.Port
            reg delete "$($case.Root)\$policy" /f
            Stop-All
          }

          "`n=== UI Automation ==="
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $process = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 20
          $element = [System.Windows.Automation.AutomationElement]
          $window = $element::RootElement.FindFirst('Children', [System.Windows.Automation.PropertyCondition]::new($element::ProcessIdProperty, $process.Id))
          "Window: $($window.Current.Name)"
          foreach ($pass in 1, 2) {
            $names = @($window.FindAll('Descendants', [System.Windows.Automation.Condition]::TrueCondition) |
              ForEach-Object { "$($_.Current.ControlType.ProgrammaticName) $($_.Current.Name)" } | Where-Object { $_ -notmatch ' $' })
            "Pass ${pass}: $($names.Count) named elements"
            $names | Select-Object -First 30 | ForEach-Object { "  $_" }
            Start-Sleep -Seconds 3
          }
          Stop-All
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-probe
          path: |
            ${{ runner.temp }}/probe/*.png
            ${{ runner.temp }}/probe/*.txt
          if-no-files-found: warn
