name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Run offline demo
        run: |
          cargo build --locked --release --bins
          ./target/release/efficient-frontier --backtests --output "$RUNNER_TEMP/efficientfrontier-demo"
          test -s "$RUNNER_TEMP/efficientfrontier-demo/report.html"
          test -s "$RUNNER_TEMP/efficientfrontier-demo/report.zip"
          test -s "$RUNNER_TEMP/efficientfrontier-demo/findings.md"
          ./target/release/efficient-frontier --target-volatility .20 --max-weight .20 --output "$RUNNER_TEMP/efficientfrontier-risk-demo"
          test -s "$RUNNER_TEMP/efficientfrontier-risk-demo/report.html"
          test -s "$RUNNER_TEMP/efficientfrontier-risk-demo/metadata.json"
          test -s "$RUNNER_TEMP/efficientfrontier-risk-demo/test/metrics.csv"

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Install the Linux window libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev webkit2gtk-driver xvfb xdotool
      - name: Lint
        run: cargo clippy --locked -p portfolio-lab --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked -p portfolio-lab
      - name: Build the programs
        run: cargo build --locked --release -p portfolio-lab -p efficient-frontier
      - name: Install tauri-driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked --version 2.0.6
      - name: Install Microsoft Edge Driver for WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          Write-Output "WebView2 $version"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP\edgedriver.zip"
          Expand-Archive "$env:RUNNER_TEMP\edgedriver.zip" -DestinationPath "$env:RUNNER_TEMP\edgedriver"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\edgedriver"
      - name: Start the app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The app's WebView2 reports its pages on a remote debugging port.
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9333'
          $env:WEBVIEW2_USER_DATA_FOLDER = "$env:RUNNER_TEMP\webview2-start"
          $app = Start-Process -FilePath target\release\portfolio-lab.exe -PassThru `
            -RedirectStandardOutput "$env:RUNNER_TEMP\app-out.txt" -RedirectStandardError "$env:RUNNER_TEMP\app-err.txt"
          $page = $null
          foreach ($second in 1..90) {
            Start-Sleep -Seconds 1
            if ($app.HasExited) { break }
            try {
              $pages = Invoke-RestMethod -Uri http://127.0.0.1:9333/json -TimeoutSec 2
              $page = $pages | Where-Object { $_.url -like 'http://app.localhost/*' -and $_.title } | Select-Object -First 1
              if ($page) { break }
            } catch {}
          }
          Write-Output "Exited: $($app.HasExited) $(if ($app.HasExited) { $app.ExitCode })"
          Get-Content "$env:RUNNER_TEMP\app-err.txt" -ErrorAction SilentlyContinue
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          if (-not $page) { throw 'The app did not show its start page.' }
          Write-Output "Page: $($page.url) | $($page.title)"
      - name: Test the window
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a cargo test --locked -p portfolio-lab --test window -- --ignored
          else
            cargo test --locked -p portfolio-lab --test window -- --ignored
          fi
      - name: Collect the programs
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/portfolio-lab.exe "dist/Portfolio Lab.exe"
            cp target/release/efficient-frontier.exe dist/
          else
            tar -czf dist/portfolio-lab-linux-x86_64.tar.gz -C target/release portfolio-lab efficient-frontier
          fi
          ls -la dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-lab-${{ runner.os }}
          path: dist/
          if-no-files-found: error
