name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Run offline demo
        run: |
          cargo build --locked --release --bins
          ./target/release/efficient-frontier --backtests --output "$RUNNER_TEMP/efficientfrontier-demo"
          test -s "$RUNNER_TEMP/efficientfrontier-demo/report.html"
          test -s "$RUNNER_TEMP/efficientfrontier-demo/report.zip"
          test -s "$RUNNER_TEMP/efficientfrontier-demo/findings.md"
          ./target/release/efficient-frontier --target-volatility .20 --max-weight .20 --output "$RUNNER_TEMP/efficientfrontier-risk-demo"
          test -s "$RUNNER_TEMP/efficientfrontier-risk-demo/report.html"
          test -s "$RUNNER_TEMP/efficientfrontier-risk-demo/metadata.json"
          test -s "$RUNNER_TEMP/efficientfrontier-risk-demo/test/metrics.csv"
