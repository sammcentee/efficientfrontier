[package]
name = "efficient-frontier"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
description = "Efficient frontier analysis for US equities: a constrained mean-variance stock model with historical tests"
license = "MIT"
repository = "https://github.com/sammcentee/efficientfrontier"
publish = false

[workspace]
members = ["desktop"]

[lib]
name = "efficient_frontier"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
clarabel = { version = "0.11.1", features = ["faer-sparse"] }
indexmap = "2.14.2"
libm = "0.2.16"
nalgebra = "0.35.0"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.0", features = ["cookies", "json"] }
zip = "9.1.3"

[dev-dependencies]
tempfile = "3.27.0"

# Solver and linear algebra code runs much faster in tests with optimized dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
